apiVersion: v1
name: "upgrade-check"
type: cli/v1
version: "2.0.0"
runtime: subprocess
config:
  usage: "check for available upgrades to installed Helm releases"
  shortHelp: "check for available upgrades to installed Helm releases"
  longHelp: "Identifies Helm releases deployed to the cluster and reports which have newer versions available in configured repositories. Provides upgrade commands for out-of-date releases."
  ignoreFlags: false
runtimeConfig:
  platformCommand:
    - os: default
      arch: default
      command: "$HELM_PLUGIN_DIR/bin/helm-upgrade-check"
  platformHooks:
    install:
      - os: default
        arch: default
        command: "$HELM_PLUGIN_DIR/scripts/install.sh"
    update:
      - os: default
        arch: default
        command: "$HELM_PLUGIN_DIR/scripts/install.sh"
